syntax = "proto3";

package mage.ws.v1;

option java_package = "mage.ws.v1";
option java_outer_classname = "WsProto";

import "ws/v1/view/view.proto";
import "ws/v1/model/model.proto";
import "result.proto";
// Strict, versioned envelopes used by the parallel Javalin WebSocket transport.
//
// Rules:
// - Every ClientMessage must include protocolVersion and requestId.
// - sessionId is required for all non-connection-class messages.
// - Every request yields exactly one ServerMessage with matching requestId.

message ClientMessage {
  string protocolVersion = 1;
  string requestId = 2;
  string sessionId = 3;

  oneof payload {
    Disconnect disconnect = 10;
    PingRequest ping = 11;
    AuthRequest auth = 12;
    MainRoomIdRequest main_room_id_request = 13;
    RoomChatIdRequest room_chat_id_request = 14;
    JoinChatRequest join_chat_request = 15;
    LeaveChatRequest leave_chat_request = 16;
    ServerStateRequest server_state_request = 17;
    UserData user_data = 18;
    PromotionMessagesRequest promotion_messages_request = 19;
    CreateTableRequest create_table_request = 20;
    CreateTournamentTableRequest create_tournament_request = 21;
    JoinTableRequest join_table_request = 22;
    RemoveTableRequest remove_table_request = 23;
    TableChatIdRequest table_chat_id_request = 24;
    IsTableOwnerRequest is_table_owner_request = 25;
    GameChatIdRequest game_chat_id_request = 26;
    TournamentChatIdRequest tournament_chat_id_request = 27;
    SendChatMessageRequest send_chat_message_request = 28;
    SendBroadcastMessageRequest send_broadcast_message_request = 29;
    TablesRequest table_request = 30;
    FinishedMatchesRequest finished_matches_request = 31;
    RoomUsersRequest room_users_request = 32;
    LobbyInfoRequest  lobby_info_request= 33;
    SendPlayerDataRequest send_player_data_request = 34;
    QuitMatchRequest quit_match_request = 35;
    QuitTournamentRequest quit_tournament_request = 36;
    QuitDraftRequest quit_draft_request = 37;
    SubmitDeckRequest submit_deck_request = 38;
    UpdateDeckRequest update_deck_request = 39;
    SetBoosterLoadedRequest set_booster_loaded_request = 40;
    SendCardPickRequest send_card_pick_request = 41;
    SendCardMarkRequest send_card_mark_request = 42;
    SendPlayerActionRequest send_player_action_request = 43;
    JoinGameRequest join_game_request = 44;
    AdminRemoveTableRequest admin_remove_table_request = 45;
    JoinDraftRequest join_draft_request = 46;
    JoinTournamentRequest join_tournament_request = 47;
    LeaveTableRequest leave_table_request = 48;
    SwapSeatsRequest swap_seats_request = 49;
    StartMatchRequest start_match_request = 50;
    StartTournamentRequest start_tournament_request = 51;
    WatchGameRequest watch_game_request = 52;
    StopWatchingRequest stop_watching_request = 53;
    ReplayGameRequest replay_game_request = 54;
    StartReplayRequest start_replay_request = 55;
    StopReplayRequest stop_replay_request = 56;
    NextPlayRequest next_play_request = 57;
    PreviousPlayRequest previous_play_request = 58;
    SkipForwardRequest skip_forward_request = 59;
    GetTableRequest get_table_request = 60;
    GetTournamentRequest get_tournament_request = 61;
    WatchTableRequest watch_table_request = 63;
  }
}

message ServerMessage {
  string protocolVersion = 1;
  string requestId = 2;
  string sessionId = 3;

  oneof payload {
    Ack ack = 10;
    Error error = 11;

    AuthResponse auth = 22;
    UUIDResponse uuid_response = 23;
    ServerStateResponse server_state_response = 24;
    PromotionMessagesResponse promotion_messages_response = 25;
    ClientCallback client_callback = 26;
    TableViewResponse table_view_response = 27;
    bool boolean = 28;

    TablesResponse lobbyGetTables = 30;
    FinishedMatchesResponse finished_matches_response = 31;
    RoomUsersResponse room_users_response = 32;
    LobbyInfoResponse lobbyGetInfo = 33;
    DraftPickViewResponse draft_pick_view_response = 34;
    TournamentViewResponse tournament_view_response = 35;
  }
}

message Ack {
  // Reserved for future structured ACK data.
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNKNOWN = 0;
  INVALID_PROTOCOL_VERSION = 1;
  MISSING_REQUEST_ID = 2;
  MISSING_SESSION_ID = 3;
  UNKNOWN_MESSAGE_TYPE = 4;
  AUTH_FAILED = 5;
  MAGE_EXCEPTION = 6;
  SERVER_ERROR = 7;
}

// Connection-class message, allowed without sessionId.
message Disconnect {
}

message PingRequest {
  string lastPingInfo = 1;
}

message AuthRequest {
  string userName = 1;
  string password = 2;
}

message AuthResponse {
  bool ok = 1;
  string message = 2;
}

message TablesRequest {
  string roomId = 1;
}

message TablesResponse {
  repeated view.TableView tables = 1;
}

message FinishedMatchesRequest {
  string roomId = 1;
}

message FinishedMatchesResponse {
  repeated view.MatchView finishedMatches = 1;
}

message RoomUsersRequest {
  string roomId = 1;
}

message RoomUsersResponse {
  view.RoomUsersView roomUsers = 1;
}

message MainRoomIdRequest {
}

message UUIDResponse {
  string uuid = 1;
}

message RoomChatIdRequest {
  string roomId = 1;
}

message JoinChatRequest {
  string chatId = 1;
}

message LeaveChatRequest {
  string chatId = 1;
}

message ServerStateRequest {
}

message ServerStateResponse {
  model.ServerState serverState = 1;
}

message UserData {
  model.UserData userData = 1;
  model.MageVersion mageVersion = 2;
  string userIdStr = 3;
}

message LobbyInfoRequest {
  string roomId = 1;
  bool includeFinishedMatches = 2;
  bool includeRoomUsers = 3;
}

message LobbyInfoResponse {
  repeated view.TableView tables = 1;
  repeated view.MatchView finishedMatches = 2;
  view.RoomUsersView roomUsers = 3;
}

message PromotionMessagesRequest {
}

message PromotionMessagesResponse {
  repeated string messages = 1;
}

message ClientCallback {
  string method = 1;
  string object_id = 2;
  int32 message_id = 3;
  bytes data = 4;
  string data_type = 5;
}

message CreateTableRequest {
  string roomId = 1;
  mage.game.result.MatchOptionsProto matchOptions = 2;
}

message TableViewResponse {
  view.TableView tableView = 1;
}

message CreateTournamentTableRequest {
  string roomId = 1;
  model.TournamentOptions tournamentOptions = 2;
}

message JoinTableRequest {
  string roomId = 1;
  string tableId = 2;
  string playerName = 3;
  string playerType = 4;
  int32 aiSkill = 5;
  model.DeckCardLists deckCardLists = 6;
  string password = 7;
}

message RemoveTableRequest {
  string roomId = 1;
  string tableId = 2;
}

message SubmitDeckRequest {
  string tableId = 1;
  model.DeckCardLists deckCardLists = 2;
}

message UpdateDeckRequest {
  string tableId = 1;
  model.DeckCardLists deckCardLists = 2;
}

message SetBoosterLoadedRequest {
  string draftId = 1;
}

message SendCardPickRequest {
  string draftId = 1;
  string cardId = 2;
  repeated string hiddenCards = 3;
}

message SendCardMarkRequest {
  string draftId = 1;
  string cardId = 2;
}

message DraftPickViewResponse {
  view.DraftPickView draftPickView = 1;
}

message SendPlayerActionRequest {
  string playerAction = 1;
  string gameId = 2;
  oneof data {
    int32 integerData = 3;
    string uuidData = 4;
    string stringData = 5;
    // If none set, data is null
  }
}

message JoinGameRequest {
  string gameId = 1;
}

message AdminRemoveTableRequest {
  string tableId = 1;
}

message JoinDraftRequest {
  string draftId = 1;
}

message TournamentViewResponse {
  view.TournamentView tournament_view = 1;
}

message JoinTournamentRequest {
  string tournamentId = 1;
}

message LeaveTableRequest {
  string roomId = 1;
  string tableId = 2;
}

message SwapSeatsRequest {
  string roomId = 1;
  string tableId = 2;
  int32 seatNum1 = 3;
  int32 seatNum2 = 4;
}

message StartMatchRequest {
  string roomId = 1;
  string tableId = 2;
}

message StartTournamentRequest {
  string roomId = 1;
  string tableId = 2;
}

message WatchGameRequest {
  string gameId = 1;
}

message StopWatchingRequest {
  string gameId = 1;
}

message ReplayGameRequest {
  string gameId = 1;
}

message StartReplayRequest {
  string gameId = 1;
}

message StopReplayRequest {
  string gameId = 1;
}

message NextPlayRequest {
  string gameId = 1;
}

message PreviousPlayRequest {
  string gameId = 1;
}

message SkipForwardRequest {
  string gameId = 1;
  int32 moves = 2;
}

message GetTableRequest {
  string roomId = 1;
  string tableId = 2;
}

message GetTournamentRequest {
  string tournamentId = 1;
}

message IsTableOwnerRequest {
  string roomId = 1;
  string tableId = 2;
}

message WatchTableRequest {
  string roomId = 1;
  string tableId = 2;
}

message TableChatIdRequest {
  string tableId = 1;
}

message GameChatIdRequest {
  string gameId = 1;
}

message TournamentChatIdRequest {
  string tournamentId = 1;
}

message SendChatMessageRequest {
  string chatId = 1;
  string message = 2;
}

message SendBroadcastMessageRequest {
  string message = 1;
}

message SendPlayerDataRequest {
  string gameId = 1;
  string playerId = 6;  // only used for mana_type_data
  oneof data {
    string uuid_data = 2;
    bool boolean_data = 3;
    int32 integer_data = 4;
    string string_data = 5;
    string mana_type_data = 7;  // ManaType as string (BLACK, BLUE, GREEN, RED, WHITE, GENERIC, COLORLESS)
  }
}

message QuitMatchRequest {
  string gameId = 1;
}

message QuitTournamentRequest {
  string tournamentId = 1;
}

message QuitDraftRequest {
  string draftId = 1;
}