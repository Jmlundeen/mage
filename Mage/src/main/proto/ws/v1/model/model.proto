syntax="proto3";

package mage.ws.v1.model;
option java_package="mage.ws.v1.model";
option java_outer_classname="ModelProto";

// Represents the Mage server version information.
// @author BetaSteward_at_googlemail.com
message MageVersion {
  int32 major = 1;
  int32 minor = 2;
  int32 release = 3;
  string releaseInfo = 4;
  string buildTime = 5;
}

// Represents the state of the server.
// @author BetaSteward_at_googlemail.com
message ServerState {
  repeated GameTypeView gameTypes = 1;
  repeated TournamentTypeView tournamentTypes = 2;
  repeated string playerTypes = 3;
  repeated string deckTypes = 4;
  repeated string draftCubes = 5;
  bool testMode = 6;
  MageVersion mageVersion = 9;
  int64 cardsContentVersion = 7;
  int64 expansionsContentVersion = 8;
}

// User data that is passed during connection to the server.
message UserData {
  int32 group_id = 1;
  int32 avatar_id = 2;
  bool allow_request_show_hand_cards = 3;
  bool confirm_empty_mana_pool = 4;
  UserSkipPrioritySteps user_skip_priority_steps = 5;
  string flag_name = 6;
  bool ask_move_to_grave_order = 7;
  bool mana_pool_automatic = 8;
  bool mana_pool_automatic_restricted = 9;
  bool pass_priority_cast = 10;
  bool pass_priority_activation = 11;
  bool auto_order_trigger = 12;
  int32 auto_target_level = 13;
  bool use_same_settings_for_replacement_effects = 14;
  bool use_first_mana_ability = 15;
  string user_id_str = 16;

  // map: game UUID (string) -> list of player UUIDs (string)
  map<string, PlayerIdList> requested_hand_players_list = 17;

  string match_history = 18;
  int32 match_quit_ratio = 19;
  string tourney_history = 20;
  int32 tourney_quit_ratio = 21;

  int32 general_rating = 22;
  int32 constructed_rating = 23;
  int32 limited_rating = 24;
}

// Wrapper for a set/list of player UUIDs (proto has no set type)
message PlayerIdList {
  repeated string player_ids = 1;
}

// @author LevelX2
message UserSkipPrioritySteps {
  // final SkipPrioritySteps yourTurn;
  SkipPrioritySteps your_turn = 1;

  // final SkipPrioritySteps opponentTurn;
  SkipPrioritySteps opponent_turn = 2;

  bool stop_on_declare_attackers = 3;
  bool stop_on_declare_blockers_with_zero_permanents = 4;
  bool stop_on_declare_blockers_with_any_permanents = 5;
  bool stop_on_all_main_phases = 6;
  bool stop_on_all_end_phases = 7;
  bool stop_on_stack_new_objects = 8;
}

// @author LevelX2
message SkipPrioritySteps {
  // boolean upkeep = false;
  bool upkeep = 1;

  // boolean draw = false;
  bool draw = 2;

  // boolean main1 = true;
  bool main1 = 3;

  // boolean beforeCombat = false;
  bool before_combat = 4;

  // boolean endOfCombat = false;
  bool end_of_combat = 5;

  // boolean main2 = true;
  bool main2 = 6;

  // boolean endOfTurn = false;
  bool end_of_turn = 7;
}

// @author BetaSteward_at_googlemail.com
message TournamentOptions {
  string name = 1;
  string tournament_type = 2;
  repeated string player_types = 3;
  string match_options_name = 4;
  string match_options_game_type = 5;
  bool match_options_multi_player = 6;
  LimitedOptions limited_options = 7;
  bool watching_allowed = 8;
  bool plane_chase = 9;
  int32 number_rounds = 10;
  string password = 11;
  int32 quit_ratio = 12;
  int32 minimum_rating = 13;
}

// @author BetaSteward_at_googlemail.com
message LimitedOptions {
  repeated string set_codes = 1;
  int32 construction_time = 2;
  string draft_cube_name = 3;
  int32 number_boosters = 4;
  bool is_random = 5;
  bool is_reshuffled = 6;
  bool is_rich_man = 7;
  string jumpstart_packs = 8;
  bool is_jumpstart = 9;
}

// @author LevelX2
message DeckCardInfo {
  string card_name = 1;
  string set_code = 2;
  string card_number = 3;
  int32 amount = 4;
}

// @author stravant@gmail.com
message DeckCardLayout {
  // Nested structure: List<List<List<DeckCardInfo>>>
  // Represented as repeated CardLayoutLayer
  repeated CardLayoutLayer layers = 1;
  string settings = 2;
}

// Helper message for nested list structure
message CardLayoutLayer {
  repeated CardLayoutGroup groups = 1;
}

message CardLayoutGroup {
  repeated DeckCardInfo cards = 1;
}

// @author BetaSteward_at_googlemail.com, JayDi85
message DeckCardLists {
  string name = 1;
  string author = 2;
  repeated DeckCardInfo cards = 3;
  repeated DeckCardInfo sideboard = 4;
  DeckCardLayout card_layout = 5;
  DeckCardLayout sideboard_layout = 6;
}

message GameTypeView {
  string name = 1;
  int32 minPlayers = 2;
  int32 maxPlayers = 3;
  int32 numTeams = 4;
  int32 playersPerTeam = 5;
  bool useRange = 6;
  bool useAttackOption = 7;
}

message TournamentTypeView {
  string name = 1;
  int32 minPlayers = 2;
  int32 maxPlayers = 3;
  int32 numBoosters = 4;
  bool draft = 5;
  bool limited = 6;
  bool cubeBooster = 7;
  bool elimination = 8;
  bool random = 9;
  bool reshuffled = 10;
  bool richMan = 11;
  bool jumpstart = 12;
}
