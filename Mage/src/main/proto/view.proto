syntax = "proto3";

package mage.ws.view;

option java_outer_classname = "ViewProto";

import "model.proto";

// Mirrors mage.view.TableView (fields actually used by lobby UI)
message TableView {
  string tableId = 1;
  string gameType = 2;
  string deckType = 3;
  string tableName = 4;
  string controllerName = 5;
  string additionalInfoShort = 6;
  string additionalInfoFull = 7;
  int64 createTimeMillis = 8;
  TableState tableState = 9;
  SkillLevel skillLevel = 10;
  string tableStateText = 11;
  string seatsInfo = 12;
  bool isTournament = 13;
  repeated SeatView seats = 14;
  repeated string games = 15;
  string quitRatio = 16;
  string minimumRating = 17;
  bool limited = 18;
  bool rated = 19;
  bool isPasswordProtected = 20;
  bool spectatorsAllowed = 21;
}

// Mirrors mage.view.MatchView (fields actually used by lobby UI)
message MatchView {
  string tableId = 1;
  string matchId = 2;
  string matchName = 3;
  string gameType = 4;
  string deckType = 5;
  repeated string games = 6;
  string result = 7;
  string players = 8;
  int64 startTimeMillis = 9;
  int64 endTimeMillis = 10;
  bool replayAvailable = 11;
  bool isTournament = 12;
  bool rated = 13;
}

// Mirrors mage.view.RoomUsersView
message RoomUsersView {
  int32 numberActiveGames = 1;
  int32 numberGameThreads = 2;
  int32 numberMaxGames = 3;
  repeated UsersView usersView = 4;
}

// Mirrors mage.view.UsersView
message UsersView {
  string flagName = 1;
  string userName = 2;
  string matchHistory = 3;
  int32 matchQuitRatio = 4;
  string tourneyHistory = 5;
  int32 tourneyQuitRatio = 6;
  string infoGames = 7;
  string infoPing = 8;
  int32 generalRating = 9;
  int32 constructedRating = 10;
  int32 limitedRating = 11;
}

// Mirrors mage.view.UserView
message UserView {
  string userName = 1;
  string host = 2;
  string sessionId = 3;
  int64 timeConnectedInMillis = 4;
  int64 lastActivityInMillis = 5;
  string gameInfo = 6;
  string userState = 7;
  int64 muteChatUntilInMillis = 8;
  string clientVersion = 9;
  string email = 10;
  string userIdStr = 11;
}

// Mirrors mage.view.UserDataView
message UserDataView {
  int32 avatarId = 1;
  int32 userGroup = 2;
  bool confirmEmptyManaPool = 3;
  string flagName = 4;
  bool askMoveToGraveOrder = 5;
  model.UserSkipPrioritySteps skipPrioritySteps = 6;
}

message SeatView {
  string flagName = 1;
  string playerId = 2;
  string playerName = 3;
  string playerType = 4;
  string history = 5;
  int32 generalRating = 6;
  int32 constructedRating = 7;
  int32 limitedRating = 8;
}


enum TableState {
  LOBBY_TABLE_STATE_UNKNOWN = 0;
  WAITING = 1;
  READY_TO_START = 2;
  STARTING = 3;
  DRAFTING = 4;
  CONSTRUCTING = 5;
  DUELING = 6;
  SIDEBOARDING = 7;
  FINISHED = 8;
}

enum SkillLevel {
  LOBBY_SKILL_LEVEL_UNKNOWN = 0;
  BEGINNER = 1;
  CASUAL = 2;
  SERIOUS = 3;
}

// Mirrors mage.view.SimpleCardsView
message SimpleCardsView {
  repeated SimpleCardView cards = 1;
}

// Mirrors mage.view.SimpleCardView
message SimpleCardView {
  string id = 1;
  string expansionSetCode = 2;
  string cardNumber = 3;
  bool usesVariousArt = 4;
  bool gameObject = 5;
  bool isChoosable = 6;
  bool isSelected = 7;
  // PlayableObjectStats is filled on client side from GameView, not serialized
}

// Mirrors mage.view.CardView
message CardView {
  // embed simple card as a base
  SimpleCardView simple = 1;

  string parent_id = 2;
  string name = 3; // TODO: remove duplicated field name/displayName???
  string display_name = 4;
  string display_full_name = 5;
  repeated string rules = 6;

  string power = 7;
  string toughness = 8;
  string loyalty = 9;
  string starting_loyalty = 10;
  string defense = 11;
  string starting_defense = 12;

  // card types and sub/supertypes as strings to avoid coupling to game enums
  repeated string card_types = 13;
  repeated string sub_types = 14;
  repeated string super_types = 15;

  // colors/frame/style/rarity as strings for simplicity
  model.ObjectColor color = 16;
  model.ObjectColor frame_color = 17;
  string frame_style = 18;

  repeated string mana_cost_left = 19;
  repeated string mana_cost_right = 20;
  int32 mana_value = 21;
  string rarity = 22;

  string mage_object_type = 23;
  bool is_ability = 24;
  string ability_type = 25;
  bool is_token = 26;

  // ability and second face use recursive CardView references
  CardView ability = 27;

  string image_file_name = 28;
  int32 image_number = 29;

  bool extra_deck_card = 30;
  bool transformable = 31;
  CardView second_card_face = 32;
  bool transformed = 33;

  bool flip_card = 34;
  bool face_down = 35;

  string alternate_name = 36;
  string alternate_number = 37;

  bool is_split_card = 38;
  string left_split_name = 39;
  string left_split_costs_str = 40;
  repeated string left_split_rules = 41;
  string left_split_type_line = 42;
  string right_split_name = 43;
  string right_split_costs_str = 44;
  repeated string right_split_rules = 45;
  string right_split_type_line = 46;

  bool is_double_faced_card = 47;
  model.ArtRect art_rect = 48;

  // targets/linked cards as string UUIDs
  repeated string targets = 49;
  string paired_card = 50;
  repeated string banded_cards = 51;

  bool paid = 52;
  // Counters on a card (name + count)
  repeated CounterView counters = 53;

  bool controlled_by_owner = 54;
  string zone = 55;

  bool rotate = 56;
  bool hide_info = 57;
  bool can_attack = 58;
  bool can_block = 59;
  bool in_viewer_only = 60;

  repeated CardIconView card_icons = 61;

  string original_power = 62;
  string original_toughness = 63;
  string original_color_identity = 64;
  bool original_is_copy = 65;
}

// Mirrors mage.view.PermanentView
message PermanentView {
  CardView card_view = 1;

  bool tapped = 2;
  bool flipped = 3;
  bool phased_in = 4;
  bool summoning_sickness = 5;
  int32 damage = 6;
  repeated string attachments = 7;
  CardView original = 8;
  bool copy = 9;
  string name_owner = 10;
  string name_controller = 11;
  bool controlled = 12;
  string attached_to = 13;
  bool morphed = 14;
  bool disguised = 15;
  bool manifested = 16;
  bool cloaked = 17;
  bool attached_to_permanent = 18;
  bool attached_controller_differs = 19;
}

// CounterView mirrors mage.view.CounterView
message CounterView {
  string name = 1;
  int32 count = 2;
}

message CardIconView {
  model.CardIconType icon_type = 1;
  string text = 2;
  string hint = 3;
}

message ManaPoolView {
  int32 red = 1;
  int32 green = 2;
  int32 blue = 3;
  int32 white = 4;
  int32 black = 5;
  int32 colorless = 6;
}

// Mirrors mage.view.EmblemView
message EmblemView {
  string id = 1;
  string name = 2;
  string card_number = 3;
  string image_file_name = 4;
  int32 image_number = 5;
  bool uses_various_art = 6;
  string expansion_set_code = 7;
  repeated string rules = 8;
}

// Mirrors mage.view.DungeonView
message DungeonView {
  string id = 1;
  string name = 2;
  string image_file_name = 3;
  int32 image_number = 4;
  string expansion_set_code = 5;
  repeated string rules = 6;
}

// Mirrors mage.view.PlaneView
message PlaneView {
  string id = 1;
  string name = 2;
  string image_file_name = 3;
  int32 image_number = 4;
  string expansion_set_code = 5;
  repeated string rules = 6;
}

// Mirrors mage.view.CommanderView
message CommanderView {
  CardView card_view = 1;
}

// Mirrors mage.view.CommandObjectView
message CommandObjectView {
  oneof type {
    EmblemView emblem = 1;
    DungeonView dungeon = 2;
    PlaneView plane = 3;
    CommanderView commander = 4;
  }
}

// Mirrors mage.view.DraftPickView
message DraftPickView {
  SimpleCardsView booster = 1;
  SimpleCardsView picks = 2;
  bool picking = 3;
  int32 timeout = 4;
}

// Mirrors mage.view.TournamentView
message TournamentView {
  string tournamentName = 1;
  string tournamentType = 2;
  string tournamentState = 3;
  int64 startTimeMillis = 4;
  int64 endTimeMillis = 5;
  int64 stepStartTimeMillis = 6;
  int64 serverTimeMillis = 7;
  int32 constructionTime = 8;
  bool watchingAllowed = 9;
  repeated RoundView rounds = 10;
  repeated TournamentPlayerView players = 11;
  string runningInfo = 12;
}

// Mirrors mage.view.TournamentPlayerView
message TournamentPlayerView {
  string flagName = 1;
  string name = 2;
  string state = 3;
  string results = 4;
  string history = 5;
  int32 points = 6;
  bool quit = 7;
}

// Mirrors mage.view.RoundView
message RoundView {
  repeated TournamentGameView games = 1;
}

// Mirrors mage.view.TournamentGameView
message TournamentGameView {
  int32 roundNum = 1;
  string matchId = 2;
  string gameId = 3;
  string state = 4;
  string result = 5;
  string players = 6;
  string tableId = 7;
}

// Mirrors mage.view.PlayerView
message PlayerView {
  string playerId = 1;
  string name = 2;
  bool controlled = 3;
  bool isHuman = 4;
  int32 life = 5;
  repeated CounterView counters = 6;
  int32 wins = 7;
  int32 winsNeeded = 8;
  int32 libraryCount = 9;
  int32 handCount = 10;
  bool isActive = 11;
  bool hasPriority = 12;
  bool timerActive = 13;
  bool hasLeft = 14;
  ManaPoolView manaPool = 15;
  map<string, CardView> graveyard = 16;
  map<string, CardView> exile = 17;
  map<string, CardView> sideboard = 18;
  map<string, CardView> helperCards = 19;
  map<string, PermanentView> battlefield = 20;
  CardView topCard = 21;
  model.UserData userData = 22;
  repeated CommandObjectView commandList = 23;
  repeated string attachments = 24;
  int32 statesSavedSize = 25;
  int32 priorityTimeLeftSecs = 26;
  int32 bufferTimeLeft = 27;
  bool passedTurn = 28;
  bool passedUntilEndOfTurn = 29;
  bool passedUntilNextMain = 30;
  bool passedUntilStackResolved = 31;
  bool passedAllTurns = 32;
  bool passedUntilEndStepBeforeMyTurn = 33;
  bool monarch = 34;
  bool initiative = 35;
  repeated string designationNames = 36;
}

// Mirrors mage.view.ExileView
message ExileView {
  string id = 1;
  string name = 2;
  map<string, CardView> cards = 3;
}

// Mirrors mage.view.RevealedView
message RevealedView {
  string name = 1;
  map<string, CardView> cards = 2;
}

// Mirrors mage.view.LookedAtView
message LookedAtView {
  string name = 1;
  SimpleCardsView cards = 2;
}

// Mirrors mage.view.CombatGroupView
message CombatGroupView {
  map<string, PermanentView> attackers = 1;
  map<string, PermanentView> blockers = 2; // these are likely PermanentViews but CardsView uses CardView
  bool isBlocked = 3;
  string defenderName = 4;
  string defenderId = 5;
}

// Mirrors mage.view.GameView
message GameView {
  int32 priorityTime = 1;
  int32 bufferTime = 2;
  repeated PlayerView players = 3;
  string myPlayerId = 4; // null for watcher
  map<string, CardView> myHand = 5;
  map<string, CardView> myHelperEmblems = 6;
  model.PlayableObjectsList canPlayObjects = 7;
  map<string, SimpleCardsView> opponentHands = 8;
  map<string, SimpleCardsView> watchedHands = 9;
  map<string, CardView> stack = 10;
  repeated ExileView exiles = 11;
  repeated RevealedView revealed = 12;
  repeated LookedAtView lookedAt = 13;
  repeated RevealedView companion = 14;
  repeated CombatGroupView combat = 15;
  string phase = 16; // Use enum string representation
  string step = 17;  // Use enum string representation
  string activePlayerId = 18;
  string activePlayerName = 19;
  string priorityPlayerName = 20;
  int32 turn = 21;
  bool special = 22;
  bool rollbackTurnsAllowed = 23;
  int32 totalErrorsCount = 24;
  int32 totalEffectsCount = 25;
  int32 gameCycle = 26;
}
