syntax = "proto3";

package mage.ws.v1;

option java_package = "mage.ws.v1";
option java_outer_classname = "WsProto";

// Strict, versioned envelopes used by the parallel Javalin WebSocket transport.
//
// Rules:
// - Every ClientMessage must include protocolVersion and requestId.
// - sessionId is required for all non-connection-class messages.
// - Every request yields exactly one ServerMessage with matching requestId.

message ClientMessage {
  string protocolVersion = 1;
  string requestId = 2;
  string sessionId = 3;

  oneof payload {
    HelloRequest hello = 10;
    PingRequest ping = 11;
    AuthRequest auth = 12;
  }
}

message ServerMessage {
  string protocolVersion = 1;
  string requestId = 2;
  string sessionId = 3;

  oneof payload {
    Ack ack = 10;
    Error error = 11;

    HelloResponse hello = 20;
    PingResponse ping = 21;
    AuthResponse auth = 22;
  }
}

message Ack {
  // Reserved for future structured ACK data.
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNKNOWN = 0;
  INVALID_PROTOCOL_VERSION = 1;
  MISSING_REQUEST_ID = 2;
  MISSING_SESSION_ID = 3;
  UNKNOWN_MESSAGE_TYPE = 4;
  AUTH_FAILED = 5;
  SERVER_ERROR = 6;
}

// Connection-class message, allowed without sessionId.
message HelloRequest {
  // Optional client name/version strings for diagnostics.
  string clientName = 1;
  string clientVersion = 2;
}

message HelloResponse {
  string serverName = 1;
  string serverVersion = 2;
}

message PingRequest {
  int64 clientTimeMillis = 1;
}

message PingResponse {
  int64 serverTimeMillis = 1;
  int64 clientTimeMillis = 2;
}

message AuthRequest {
  string userName = 1;
  string password = 2;
}

message AuthResponse {
  bool ok = 1;
  string message = 2;
}
